# VPS journald (docs/platform.md §11.1 and §12): the containers' logs (zones, platform, Caddy,
# database) carry names and IPs, so they are kept 30 days at most.
# Copy to /etc/systemd/journald.conf.d/eldmark.conf and "systemctl restart systemd-journald".
# It applies to the whole VPS journal, not just Docker.
[Journal]
Storage=persistent
MaxRetentionSec=30day
SystemMaxUse=2G
