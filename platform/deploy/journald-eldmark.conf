# journald del VPS (docs/plataforma.md §11.1 y §12): los registros de los contenedores (zonas,
# plataforma, Caddy, base) llevan nombres e IP, así que se guardan 30 días como mucho.
# Copiar a /etc/systemd/journald.conf.d/eldmark.conf y «systemctl restart systemd-journald».
# Vale para todo el journal del VPS, no solo para Docker.
[Journal]
Storage=persistent
MaxRetentionSec=30day
SystemMaxUse=2G
