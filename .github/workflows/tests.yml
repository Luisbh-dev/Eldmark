name: Pruebas

# Full test suite (including the network and process tests) with Godot 4.7.2 headless on Linux, on
# every push to main and on every pull request (a push to a PR branch already triggers it through
# pull_request; triggering it on push too burned double the minutes). For a broken test to block the
# merge, the "Suite completa" job has to be marked as a required check in the branch protection
# (Settings > Branches): that cannot be configured from this file.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the previous run that is still in progress.
concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_FILE: Godot_v4.7.2-stable_linux.x86_64
  # SHA-512 checksum of the zip, from SHA512-SUMS.txt of the 4.7.2-stable release.
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65

jobs:
  # The suite is split into four parts that run at the same time (run_tests.gd --shard=K/4): the whole
  # thing takes about 18 min on a 4-core machine and grows with every phase.
  tests:
    name: Suite ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    steps:
      # No lfs: the checkout leaves the LFS pointers. The objects are downloaded after restoring the
      # cache, so only the missing ones get downloaded (with lfs: true the checkout would download all of
      # them on every run, before the cache could be consulted).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Lista de objetos LFS
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Caché de objetos LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: |
            lfs-

      - name: Descargar objetos LFS
        run: git lfs pull

      - name: Caché de Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_SHA512 }}

      - name: Descargar Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/godot"
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_FILE}.zip"
          echo "${GODOT_SHA512}  $RUNNER_TEMP/godot.zip" | sha512sum --check -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$HOME/godot"
          chmod +x "$HOME/godot/${GODOT_FILE}"

      - name: Godot en el PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sf "$HOME/godot/${GODOT_FILE}" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Versión de Godot
        run: godot --headless --version

      - name: Importar el proyecto
        run: |
          mkdir -p build
          godot --headless --path . --import > build/import.log 2>&1 || {
            cat build/import.log
            exit 1
          }

      # The tests start their own Godot processes (server and clients). This step's timeout is shorter
      # than the job's so that the logs step still gets to run in time if it hangs.
      - name: Pruebas
        timeout-minutes: 15
        run: |
          set -o pipefail
          godot --headless --path . -s res://tests/run_tests.gd -- --shard=${{ matrix.shard }}/4 2>&1 | tee build/tests.log

      - name: Resumen
        if: always()
        run: |
          if [ -f build/tests.log ]; then
            grep -E "^(FAIL|Resumen)" build/tests.log | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Subir logs e informes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.shard }}
          path: build/
          if-no-files-found: ignore
          retention-days: 14

  # A single check with the usual name, for the branch protection: it passes only if all four parts
  # pass.
  suite:
    name: Suite completa
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resultado de las cuatro partes
        run: test "${{ needs.tests.result }}" = "success"

  # Windows is the development platform and there OS.is_process_running only knows about its own child
  # processes: this job runs the LocalServerLauncher tests (with their helper processes), not the
  # full suite, which is run by hand on Windows (docs/history/2026-10-night-report.md).
  tests-windows:
    name: Windows (LocalServerLauncher)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GODOT_WIN_FILE: Godot_v4.7.2-stable_win64
      # SHA-512 checksum of the zip, from SHA512-SUMS.txt of the 4.7.2-stable release.
      GODOT_WIN_SHA512: 83decd58fdf67b9d657958a1ae6bf1929c20785315a81effe245874cdc57acb709bf868e00778a96984338c1b29dafdb453c6847747694621c6ecf5da2259993
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Lista de objetos LFS
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Caché de objetos LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: |
            lfs-

      - name: Descargar objetos LFS
        run: git lfs pull

      - name: Caché de Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-win-${{ env.GODOT_VERSION }}-${{ env.GODOT_WIN_SHA512 }}

      - name: Descargar Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/godot"
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_WIN_FILE}.exe.zip"
          echo "${GODOT_WIN_SHA512}  $RUNNER_TEMP/godot.zip" | sha512sum --check -
          7z x -y -o"$HOME/godot" "$RUNNER_TEMP/godot.zip"

      # The console executable (the one that writes to standard output) is a wrapper that launches the
      # main one by looking it up under its own name without "_console": if renamed, it fails with
      # "Invalid wrapper executable name". A "godot" script calls it by its original name.
      - name: Godot en el PATH
        run: |
          printf '#!/usr/bin/env bash\nexec "%s/%s_console.exe" "$@"\n' "$HOME/godot" "$GODOT_WIN_FILE" > "$HOME/godot/godot"
          chmod +x "$HOME/godot/godot"
          cygpath -w "$HOME/godot" >> "$GITHUB_PATH"

      - name: Versión de Godot
        run: godot --headless --version

      - name: Importar el proyecto
        run: |
          mkdir -p build
          godot --headless --path . --import > build/import.log 2>&1 || {
            cat build/import.log
            exit 1
          }

      - name: Pruebas de LocalServerLauncher
        timeout-minutes: 15
        run: |
          set -o pipefail
          godot --headless --path . -s res://tests/run_tests.gd -- --filter=test_local_server_launcher 2>&1 | tee build/tests.log

      - name: Resumen
        if: always()
        run: |
          if [ -f build/tests.log ]; then
            grep -E "^(FAIL|Resumen)" build/tests.log | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Subir logs e informes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-windows
          path: build/
          if-no-files-found: ignore
          retention-days: 14

  # Go platform service (docs/platform.md §2.6 and §10.3), independent of the Godot jobs: secrets
  # check of the index, gofmt, go vet and go test with an ephemeral PostgreSQL (initdb from the
  # ubuntu-latest PostgreSQL; ELDMARK_REQUIRE_PG=1 makes the tests fail if it is missing, instead of
  # skipping). The platform/deploy tests (P9b) also run the backup and restore scripts, shellcheck and
  # "docker compose config" (no daemon), which the ubuntu-latest image ships with;
  # ELDMARK_REQUIRE_DEPLOY_TOOLS=1 makes them fail if any tool is missing. For it to block the merge,
  # "Plataforma" must also be marked as a required check in the branch protection.
  platform:
    name: Plataforma
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      ELDMARK_REQUIRE_PG: "1"
      ELDMARK_REQUIRE_DEPLOY_TOOLS: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Secretos fuera del repositorio
        run: tools/check_secrets.sh

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum

      - name: PostgreSQL
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb > /dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          ls -d /usr/lib/postgresql/*/bin
          go version

      - name: gofmt
        working-directory: platform
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Archivos sin gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # The end-to-end tests (platform/e2e, e2e tag) are also compiled and vetted here; they are run by
      # the "Plataforma e2e" job.
      - name: go vet
        working-directory: platform
        run: |
          go vet ./...
          go vet -tags e2e ./e2e

      - name: go test
        working-directory: platform
        timeout-minutes: 10
        run: go test -p 2 ./...

  # End to end (docs/platform.md P10, §15): the real Go platform in the test process, with an
  # ephemeral PostgreSQL, against test_world zones with --platform and bots with a real Godot account
  # (platform/e2e, e2e tag: TestEnterAndSave and TestZoneCrash, and those of progression.md P8 when
  # they arrive). It reuses the LFS and Godot caches of the Godot jobs (same keys) and exports
  # ELDMARK_GODOT; TestMain imports the project. If it fails, it uploads the platform, zone and bot
  # logs. For it to block the merge, "Plataforma e2e" must be marked as a required check in the branch
  # protection.
  platform-e2e:
    name: Plataforma e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      ELDMARK_REQUIRE_PG: "1"
      ELDMARK_REQUIRE_GODOT: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Lista de objetos LFS
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Caché de objetos LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: |
            lfs-

      - name: Descargar objetos LFS
        run: git lfs pull

      - name: Caché de Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_SHA512 }}

      - name: Descargar Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/godot"
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_FILE}.zip"
          echo "${GODOT_SHA512}  $RUNNER_TEMP/godot.zip" | sha512sum --check -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$HOME/godot"
          chmod +x "$HOME/godot/${GODOT_FILE}"

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum

      - name: PostgreSQL
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb > /dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          ls -d /usr/lib/postgresql/*/bin

      - name: Versiones
        run: |
          go version
          "$HOME/godot/${GODOT_FILE}" --headless --version

      # The logs of each test are left in $RUNNER_TEMP/e2e (outside the project, which Godot imports).
      - name: Pruebas de extremo a extremo
        working-directory: platform
        timeout-minutes: 15
        run: |
          set -o pipefail
          export ELDMARK_GODOT="$HOME/godot/${GODOT_FILE}"
          export ELDMARK_E2E_ARTIFACTS="$RUNNER_TEMP/e2e"
          mkdir -p "$ELDMARK_E2E_ARTIFACTS"
          go test -tags e2e -count=1 -v -timeout 14m ./e2e 2>&1 | tee "$ELDMARK_E2E_ARTIFACTS/go-test.log"

      - name: Resumen
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/e2e/go-test.log" ]; then
            grep -E "^(--- |ok|FAIL)|: Test[A-Za-z]+: [0-9.]+ s" "$RUNNER_TEMP/e2e/go-test.log" | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Subir registros
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-e2e-logs
          path: ${{ runner.temp }}/e2e/
          if-no-files-found: ignore
          retention-days: 14
