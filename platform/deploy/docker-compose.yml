# Deployment of one environment (staging or production) on a VPS: docs/plataforma.md §10 and §12.
#
#   cp staging.env.example staging.env        (and fill it in; staging.env does not go into git)
#   docker compose --env-file staging.env up -d                       database, platform and Caddy
#   docker compose --env-file staging.env run --rm platform migrate up
#   docker compose --env-file staging.env --profile zonas up -d       the zones (TEC-20 image)
#   docker compose --env-file staging.env run --rm backup             daily backup (VPS cron)
#   docker compose --env-file staging.env run --rm restore-check      weekly test restore
#   docker compose --env-file staging.env run --rm pitr-check         point-in-time recovery test
#   docker compose --env-file staging.env exec platform eldmark-platform admin --actor <email> help
#
# Secrets: one file per secret in ELDMARK_SECRETS_DIR (./secrets by default, ignored by git),
# mounted as Docker secrets at /run/secrets/<name>; the platform's *_FILE variables read them from
# there (§2.3, §10.3). The folder owned by root and 0700; each file, 0444 (inside the containers
# they are read by unprivileged users: eldmark 10001, postgres 999):
#   postgres_password   password of the database's eldmark role
#   database_url        postgres://eldmark:<password>@db:5432/eldmark?sslmode=disable
#   ticket_keys         1:<base64 of 32 B>[,2:<...>]           (the platform and each zone)
#   zone_tokens         1:vado_gris:0:<SHA-256 in hex of the token>[,...]   (platform only)
#   zone_token_vado_gris                the token in plain text            (that zone only)
#   vado_gris_dtls_cert, vado_gris_dtls_key   PEM of that zone's DTLS (P9c): self-signed, with a CN
#                       (the name the client checks) and a passwordless key; the zone does not
#                       start if the key is not the certificate's. For example (EC P-256, the
#                       cheapest handshake; docs/plataforma.md §19.18):
#     openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 825 \
#       -keyout vado_gris_dtls_key -out vado_gris_dtls_cert \
#       -subj "/CN=vado-gris.<domain>" -addext "subjectAltName=DNS:vado-gris.<domain>"
#   email_hmac_key      base64 of 32 B
#   smtp_url            smtp://user:password@host:587
#
# All the containers write to journald (logging.driver), for 30 days at most:
# journald-eldmark.conf in /etc/systemd/journald.conf.d/ (§11.1).
#
# Validate without a daemon: docker compose --env-file staging.env.example config -q
name: eldmark-${ELDMARK_ENV:?ELDMARK_ENV (staging o production)}

x-logging: &logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  db:
    image: ${ELDMARK_DB_IMAGE:-postgres:16-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_USER: eldmark
      POSTGRES_DB: eldmark
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    # WAL for point-in-time recovery (pitr_check.sh): with WAL-G, a database image that ships it
    # (ELDMARK_DB_IMAGE), ELDMARK_PG_ARCHIVE_MODE=on and ELDMARK_PG_ARCHIVE_COMMAND="wal-g wal-push %p".
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=${ELDMARK_PG_ARCHIVE_MODE:-off}
      - -c
      - archive_command=${ELDMARK_PG_ARCHIVE_COMMAND:-/bin/true}
      - -c
      - archive_timeout=300
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "eldmark", "-d", "eldmark"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  platform:
    image: ${ELDMARK_PLATFORM_IMAGE:-eldmark-platform:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: platform
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ELDMARK_ENV: ${ELDMARK_ENV}
      ELDMARK_PUBLIC_URL: https://${ELDMARK_DOMAIN:?ELDMARK_DOMAIN (el dominio de la API pública)}
      ELDMARK_ZONE_HOSTS: ${ELDMARK_ZONE_HOSTS:?ELDMARK_ZONE_HOSTS (el public_host de las zonas)}
      ELDMARK_TRUSTED_PROXIES: ${ELDMARK_CADDY_IP:-172.30.0.2}/32
      ELDMARK_MIN_PROTOCOL: ${ELDMARK_MIN_PROTOCOL:?ELDMARK_MIN_PROTOCOL (el protocolo mínimo del cliente)}
      ELDMARK_OPEN_REALMS: ${ELDMARK_OPEN_REALMS:-vardheim,solmarch}
      ELDMARK_ENTRY_ZONES: ${ELDMARK_ENTRY_ZONES:-vardheim=vado_gris,solmarch=vado_gris}
      ELDMARK_MAIL: smtp
      ELDMARK_MAIL_FROM: ${ELDMARK_MAIL_FROM:?ELDMARK_MAIL_FROM (el remitente de los correos)}
      ELDMARK_DATABASE_URL_FILE: /run/secrets/database_url
      ELDMARK_TICKET_KEYS_FILE: /run/secrets/ticket_keys
      ELDMARK_ZONE_TOKENS_FILE: /run/secrets/zone_tokens
      ELDMARK_EMAIL_HMAC_KEY_FILE: /run/secrets/email_hmac_key
      ELDMARK_SMTP_URL_FILE: /run/secrets/smtp_url
    secrets:
      - database_url
      - ticket_keys
      - zone_tokens
      - email_hmac_key
      - smtp_url
    networks:
      - edge
      - zones
      - data
    logging: *logging

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    depends_on:
      - platform
    environment:
      ELDMARK_DOMAIN: ${ELDMARK_DOMAIN}
      ELDMARK_ACME_EMAIL: ${ELDMARK_ACME_EMAIL:?ELDMARK_ACME_EMAIL (el correo de Let's Encrypt)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: ${ELDMARK_CADDY_IP:-172.30.0.2}
    logging: *logging

  # The zones (TEC-20 builds the image: the exported server as ENTRYPOINT, with "--headless --").
  # The options --platform, --world, --channel and --public-address are from plataforma.md P4, and
  # --dtls-* from P9c. One entry per zone deployment, each with its token.
  zone-vado-gris:
    image: ${ELDMARK_ZONE_IMAGE:-eldmark-zone:local}
    profiles: [zonas]
    restart: unless-stopped
    depends_on:
      - platform
    command:
      - --server
      - --zone=vado_gris
      - --port=24600
      - --platform=http://platform:24681
      - --world=1
      - --channel=0
      - --public-address=${ELDMARK_PUBLIC_HOST:?ELDMARK_PUBLIC_HOST (el host al que conectan los clientes)}:24600
      - --dtls-cert=/run/secrets/vado_gris_dtls_cert
      - --dtls-key=/run/secrets/vado_gris_dtls_key
    environment:
      ELDMARK_ZONE_TOKEN_FILE: /run/secrets/zone_token_vado_gris
      ELDMARK_TICKET_KEYS_FILE: /run/secrets/ticket_keys
    secrets:
      - zone_token_vado_gris
      - ticket_keys
      - vado_gris_dtls_cert
      - vado_gris_dtls_key
    ports:
      - "24600:24600/udp"
    networks:
      - zones
    stop_grace_period: 30s
    logging: *logging

  # Operations (ops profile; "docker compose run --rm <service>" starts them even if the profile is
  # not active). The ops image ships PostgreSQL 16, the scripts and the platform binary.
  backup:
    image: ${ELDMARK_OPS_IMAGE:-eldmark-ops:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: ops
    profiles: [ops]
    restart: "no"
    command: ["/opt/eldmark/deploy/backup.sh"]
    environment:
      ELDMARK_DATABASE_URL_FILE: /run/secrets/database_url
      ELDMARK_BACKUP_DIR: /backups
    secrets:
      - database_url
    volumes:
      - ${ELDMARK_BACKUP_HOST_DIR:?ELDMARK_BACKUP_HOST_DIR (la carpeta de las copias en el VPS)}:/backups
    networks:
      - data
    logging: *logging

  restore-check:
    image: ${ELDMARK_OPS_IMAGE:-eldmark-ops:local}
    profiles: [ops]
    restart: "no"
    command: ["/opt/eldmark/deploy/restore_check.sh", "--dir", "/backups"]
    volumes:
      - ${ELDMARK_BACKUP_HOST_DIR}:/backups:ro
    network_mode: none
    logging: *logging

  pitr-check:
    image: ${ELDMARK_OPS_IMAGE:-eldmark-ops:local}
    profiles: [ops]
    restart: "no"
    command: ["/opt/eldmark/deploy/pitr_check.sh"]
    network_mode: none
    logging: *logging

networks:
  # Caddy and the public API. Caddy's fixed IP: it is the only one the platform reads X-Real-IP from.
  edge:
    ipam:
      config:
        - subnet: ${ELDMARK_EDGE_SUBNET:-172.30.0.0/24}
  # The zones and the internal API.
  zones: {}
  # The database: no access to the Internet.
  data:
    internal: true

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}

secrets:
  postgres_password:
    file: ${ELDMARK_SECRETS_DIR:-./secrets}/postgres_password
  database_url:
    file: ${ELDMARK_SECRETS_DIR:-./secrets}/database_url
  ticket_keys:
    file: ${ELDMARK_SECRETS_DIR:-./secrets}/ticket_keys
  zone_tokens:
    file: ${ELDMARK_SECRETS_DIR:-./secrets}/zone_tokens
  zone_token_vado_gris:
    file: ${ELDMARK_SECRETS_DIR:-./secrets}/zone_token_vado_gris
  vado_gris_dtls_cert:
    file: ${ELDMARK_SECRETS_DIR:-./secrets}/vado_gris_dtls_cert
  vado_gris_dtls_key:
    file: ${ELDMARK_SECRETS_DIR:-./secrets}/vado_gris_dtls_key
  email_hmac_key:
    file: ${ELDMARK_SECRETS_DIR:-./secrets}/email_hmac_key
  smtp_url:
    file: ${ELDMARK_SECRETS_DIR:-./secrets}/smtp_url
