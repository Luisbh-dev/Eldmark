name: Bug report
description: Something does not work as expected (English or Spanish)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security problems do not use this form; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the zone server with ...
        2. Connect a client ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Client
        - Zone server
        - Platform service (Go)
        - Bots
        - Tests / CI
        - Assets
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: godot
    attributes:
      label: Godot version
      description: For example 4.7.2-stable.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, Ubuntu 24.04, ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`, if you know it.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video
      description: Drag and drop images here.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Console or server output. Remove anything private first.
      render: text
