name: Pruebas

# Suite completa de pruebas (también las de red y las de procesos) con Godot 4.7.2 headless en
# Linux, en cada push a main y en cada pull request (un push a la rama de un PR ya la lanza por
# pull_request; lanzarla también por push gastaba el doble de minutos). Para que una prueba rota bloquee el merge hay que
# marcar el trabajo «Suite completa» como comprobación obligatoria en la protección de la rama
# (Settings > Branches): eso no se puede configurar desde este archivo.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior que sigue en marcha.
concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_FILE: Godot_v4.7.2-stable_linux.x86_64
  # Suma de comprobación SHA-512 del zip, de SHA512-SUMS.txt de la versión 4.7.2-stable.
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65

jobs:
  # La suite se reparte en cuatro partes que corren a la vez (run_tests.gd --shard=K/4): entera
  # dura unos 18 min en una máquina de 4 núcleos y crece con cada fase.
  tests:
    name: Suite ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    steps:
      # Sin lfs: el checkout deja los punteros LFS. Los objetos se bajan después de restaurar la
      # caché, así solo se descargan los que faltan (con lfs: true el checkout los bajaría todos
      # en cada ejecución, antes de poder consultar la caché).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Lista de objetos LFS
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Caché de objetos LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: |
            lfs-

      - name: Descargar objetos LFS
        run: git lfs pull

      - name: Caché de Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_SHA512 }}

      - name: Descargar Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/godot"
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_FILE}.zip"
          echo "${GODOT_SHA512}  $RUNNER_TEMP/godot.zip" | sha512sum --check -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$HOME/godot"
          chmod +x "$HOME/godot/${GODOT_FILE}"

      - name: Godot en el PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sf "$HOME/godot/${GODOT_FILE}" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Versión de Godot
        run: godot --headless --version

      - name: Importar el proyecto
        run: |
          mkdir -p build
          godot --headless --path . --import > build/import.log 2>&1 || {
            cat build/import.log
            exit 1
          }

      # Las pruebas arrancan procesos de Godot propios (servidor y clientes). El plazo de este paso
      # es menor que el del trabajo para que el paso de logs siga a tiempo si se cuelga.
      - name: Pruebas
        timeout-minutes: 15
        run: |
          set -o pipefail
          godot --headless --path . -s res://tests/run_tests.gd -- --shard=${{ matrix.shard }}/4 2>&1 | tee build/tests.log

      - name: Resumen
        if: always()
        run: |
          if [ -f build/tests.log ]; then
            grep -E "^(FAIL|Resumen)" build/tests.log | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Subir logs e informes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.shard }}
          path: build/
          if-no-files-found: ignore
          retention-days: 14

  # Una sola comprobación con el nombre de siempre, para la protección de la rama: pasa solo si
  # pasan las cuatro partes.
  suite:
    name: Suite completa
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resultado de las cuatro partes
        run: test "${{ needs.tests.result }}" = "success"

  # Windows es la plataforma de desarrollo y allí OS.is_process_running solo conoce los procesos
  # hijos propios: este trabajo ejecuta las pruebas de LocalServerLauncher (con sus procesos
  # auxiliares), no la suite completa, que se ejecuta a mano en Windows (docs/informe_noche.md).
  tests-windows:
    name: Windows (LocalServerLauncher)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GODOT_WIN_FILE: Godot_v4.7.2-stable_win64
      # Suma de comprobación SHA-512 del zip, de SHA512-SUMS.txt de la versión 4.7.2-stable.
      GODOT_WIN_SHA512: 83decd58fdf67b9d657958a1ae6bf1929c20785315a81effe245874cdc57acb709bf868e00778a96984338c1b29dafdb453c6847747694621c6ecf5da2259993
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Lista de objetos LFS
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Caché de objetos LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: |
            lfs-

      - name: Descargar objetos LFS
        run: git lfs pull

      - name: Caché de Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-win-${{ env.GODOT_VERSION }}-${{ env.GODOT_WIN_SHA512 }}

      - name: Descargar Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/godot"
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_WIN_FILE}.exe.zip"
          echo "${GODOT_WIN_SHA512}  $RUNNER_TEMP/godot.zip" | sha512sum --check -
          7z x -y -o"$HOME/godot" "$RUNNER_TEMP/godot.zip"

      # El ejecutable de consola (el que escribe en la salida estándar) es un envoltorio que lanza el
      # principal buscándolo por su propio nombre sin «_console»: renombrado, falla con «Invalid wrapper
      # executable name». Un guion «godot» lo llama con su nombre original.
      - name: Godot en el PATH
        run: |
          printf '#!/usr/bin/env bash\nexec "%s/%s_console.exe" "$@"\n' "$HOME/godot" "$GODOT_WIN_FILE" > "$HOME/godot/godot"
          chmod +x "$HOME/godot/godot"
          cygpath -w "$HOME/godot" >> "$GITHUB_PATH"

      - name: Versión de Godot
        run: godot --headless --version

      - name: Importar el proyecto
        run: |
          mkdir -p build
          godot --headless --path . --import > build/import.log 2>&1 || {
            cat build/import.log
            exit 1
          }

      - name: Pruebas de LocalServerLauncher
        timeout-minutes: 15
        run: |
          set -o pipefail
          godot --headless --path . -s res://tests/run_tests.gd -- --filter=test_local_server_launcher 2>&1 | tee build/tests.log

      - name: Resumen
        if: always()
        run: |
          if [ -f build/tests.log ]; then
            grep -E "^(FAIL|Resumen)" build/tests.log | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Subir logs e informes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-windows
          path: build/
          if-no-files-found: ignore
          retention-days: 14

  # Servicio de plataforma en Go (docs/plataforma.md §2.6 y §10.3), independiente de los trabajos de
  # Godot: comprobación de secretos del índice, gofmt, go vet y go test con un PostgreSQL efímero
  # (initdb del PostgreSQL de ubuntu-latest; ELDMARK_REQUIRE_PG=1 hace que las pruebas fallen si
  # falta, en lugar de saltarse). Las pruebas de platform/deploy (P9b) corren además los scripts de
  # copias y restauración, shellcheck y «docker compose config» (sin demonio), que la imagen de
  # ubuntu-latest trae; ELDMARK_REQUIRE_DEPLOY_TOOLS=1 hace que fallen si falta alguna herramienta.
  # Para que bloquee el merge hay que marcar también «Plataforma» como comprobación obligatoria en la
  # protección de la rama.
  platform:
    name: Plataforma
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      ELDMARK_REQUIRE_PG: "1"
      ELDMARK_REQUIRE_DEPLOY_TOOLS: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Secretos fuera del repositorio
        run: tools/check_secrets.sh

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum

      - name: PostgreSQL
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb > /dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          ls -d /usr/lib/postgresql/*/bin
          go version

      - name: gofmt
        working-directory: platform
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Archivos sin gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # Las pruebas de extremo a extremo (platform/e2e, etiqueta e2e) se compilan y se revisan aquí también; las
      # corre el trabajo «Plataforma e2e».
      - name: go vet
        working-directory: platform
        run: |
          go vet ./...
          go vet -tags e2e ./e2e

      - name: go test
        working-directory: platform
        timeout-minutes: 10
        run: go test -p 2 ./...

  # Extremo a extremo (docs/plataforma.md P10, §15): la plataforma de Go de verdad en el proceso de la prueba, con
  # un PostgreSQL efímero, contra zonas test_world con --platform y bots con cuenta de Godot de verdad
  # (platform/e2e, etiqueta e2e: TestEnterAndSave y TestZoneCrash, y las de progresion.md P8 cuando lleguen).
  # Reutiliza las cachés de LFS y de Godot de los trabajos de Godot (las mismas claves) y exporta ELDMARK_GODOT;
  # TestMain importa el proyecto. Si falla, sube los registros de la plataforma, las zonas y los bots. Para que
  # bloquee el merge hay que marcar «Plataforma e2e» como comprobación obligatoria en la protección de la rama.
  platform-e2e:
    name: Plataforma e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      ELDMARK_REQUIRE_PG: "1"
      ELDMARK_REQUIRE_GODOT: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Lista de objetos LFS
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Caché de objetos LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: |
            lfs-

      - name: Descargar objetos LFS
        run: git lfs pull

      - name: Caché de Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_SHA512 }}

      - name: Descargar Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/godot"
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_FILE}.zip"
          echo "${GODOT_SHA512}  $RUNNER_TEMP/godot.zip" | sha512sum --check -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$HOME/godot"
          chmod +x "$HOME/godot/${GODOT_FILE}"

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum

      - name: PostgreSQL
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb > /dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          ls -d /usr/lib/postgresql/*/bin

      - name: Versiones
        run: |
          go version
          "$HOME/godot/${GODOT_FILE}" --headless --version

      # Los registros de cada prueba quedan en $RUNNER_TEMP/e2e (fuera del proyecto, que Godot importa).
      - name: Pruebas de extremo a extremo
        working-directory: platform
        timeout-minutes: 15
        run: |
          set -o pipefail
          export ELDMARK_GODOT="$HOME/godot/${GODOT_FILE}"
          export ELDMARK_E2E_ARTIFACTS="$RUNNER_TEMP/e2e"
          mkdir -p "$ELDMARK_E2E_ARTIFACTS"
          go test -tags e2e -count=1 -v -timeout 14m ./e2e 2>&1 | tee "$ELDMARK_E2E_ARTIFACTS/go-test.log"

      - name: Resumen
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/e2e/go-test.log" ]; then
            grep -E "^(--- |ok|FAIL)|: Test[A-Za-z]+: [0-9.]+ s" "$RUNNER_TEMP/e2e/go-test.log" | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Subir registros
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-e2e-logs
          path: ${{ runner.temp }}/e2e/
          if-no-files-found: ignore
          retention-days: 14
