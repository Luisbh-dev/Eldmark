name: Security analysis

# CodeQL (Go and the workflow files themselves) and govulncheck (known vulnerabilities in the Go
# dependencies that the platform really calls). They run on every push to main, on every pull request
# and once a week, because new advisories appear without any change in the repository.
# GDScript is not a CodeQL language: the Godot code is covered by the test suite and the architecture
# tests instead.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  # Known vulnerabilities in the modules and the standard library that the platform calls
  # (docs/platform.md section 10.3). Fails the job on any finding that is reachable from the code.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: bash
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: platform/go.mod
          cache-dependency-path: platform/go.sum

      - name: Install govulncheck
        # Pinned by version; Dependabot does not track it, bump it by hand (noted in backlog TEC-66).
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: govulncheck
        run: |
          set -o pipefail
          "$(go env GOPATH)/bin/govulncheck" ./... 2>&1 | tee "$RUNNER_TEMP/govulncheck.log"

      - name: Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/govulncheck.log" ]; then
            tail -n 20 "$RUNNER_TEMP/govulncheck.log" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
