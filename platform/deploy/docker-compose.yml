# Despliegue de un entorno (staging o production) en un VPS: docs/plataforma.md §10 y §12.
#
#   cp staging.env.example staging.env        (y rellenarlo; staging.env no entra en git)
#   docker compose --env-file staging.env up -d                       base, plataforma y Caddy
#   docker compose --env-file staging.env run --rm platform migrate up
#   docker compose --env-file staging.env --profile zonas up -d       las zonas (imagen de TEC-20)
#   docker compose --env-file staging.env run --rm backup             copia diaria (cron del VPS)
#   docker compose --env-file staging.env run --rm restore-check      restauración de prueba semanal
#   docker compose --env-file staging.env run --rm pitr-check         prueba de la recuperación a un instante
#   docker compose --env-file staging.env exec platform eldmark-platform admin --actor <correo> help
#
# Secretos: un archivo por secreto en ELDMARK_SECRETS_DIR (./secrets por defecto, ignorada por git),
# montados como secretos de Docker en /run/secrets/<nombre>; las variables *_FILE de la plataforma
# los leen de ahí (§2.3, §10.3). La carpeta, de root y 0700; cada archivo, 0444 (dentro de los
# contenedores los leen usuarios sin privilegios: eldmark 10001, postgres 999):
#   postgres_password   contraseña del rol eldmark de la base
#   database_url        postgres://eldmark:<contraseña>@db:5432/eldmark?sslmode=disable
#   ticket_keys         1:<base64 de 32 B>[,2:<…>]           (la plataforma y cada zona)
#   zone_tokens         1:vado_gris:0:<SHA-256 en hex del token>[,…]   (solo la plataforma)
#   zone_token_vado_gris                el token en claro            (solo esa zona)
#   vado_gris_dtls_cert, vado_gris_dtls_key   PEM del DTLS de esa zona (P9c): autofirmado, con CN (el
#                       nombre que comprueba el cliente) y clave sin contraseña; la zona no arranca si
#                       la clave no es la del certificado. Por ejemplo (EC P-256, el apretón de manos
#                       más barato; docs/plataforma.md §19.18):
#     openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 825 \
#       -keyout vado_gris_dtls_key -out vado_gris_dtls_cert \
#       -subj "/CN=vado-gris.<dominio>" -addext "subjectAltName=DNS:vado-gris.<dominio>"
#   email_hmac_key      base64 de 32 B
#   smtp_url            smtp://usuario:clave@host:587
#
# Todos los contenedores escriben en journald (logging.driver), con 30 días como mucho:
# journald-eldmark.conf en /etc/systemd/journald.conf.d/ (§11.1).
#
# Validar sin demonio: docker compose --env-file staging.env.example config -q
name: eldmark-${ELDMARK_ENV:?ELDMARK_ENV (staging o production)}

x-logging: &logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  db:
    image: ${ELDMARK_DB_IMAGE:-postgres:16-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_USER: eldmark
      POSTGRES_DB: eldmark
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    # WAL para recuperar a un instante (pitr_check.sh): con WAL-G, una imagen de la base que lo
    # traiga (ELDMARK_DB_IMAGE), ELDMARK_PG_ARCHIVE_MODE=on y ELDMARK_PG_ARCHIVE_COMMAND="wal-g wal-push %p".
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=${ELDMARK_PG_ARCHIVE_MODE:-off}
      - -c
      - archive_command=${ELDMARK_PG_ARCHIVE_COMMAND:-/bin/true}
      - -c
      - archive_timeout=300
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "eldmark", "-d", "eldmark"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  platform:
    image: ${ELDMARK_PLATFORM_IMAGE:-eldmark-platform:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: platform
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ELDMARK_ENV: ${ELDMARK_ENV}
      ELDMARK_PUBLIC_URL: https://${ELDMARK_DOMAIN:?ELDMARK_DOMAIN (el dominio de la API pública)}
      ELDMARK_ZONE_HOSTS: ${ELDMARK_ZONE_HOSTS:?ELDMARK_ZONE_HOSTS (el public_host de las zonas)}
      ELDMARK_TRUSTED_PROXIES: ${ELDMARK_CADDY_IP:-172.30.0.2}/32
      ELDMARK_MIN_PROTOCOL: ${ELDMARK_MIN_PROTOCOL:?ELDMARK_MIN_PROTOCOL (el protocolo mínimo del cliente)}
      ELDMARK_OPEN_REALMS: ${ELDMARK_OPEN_REALMS:-vardheim,solmarch}
      ELDMARK_ENTRY_ZONES: ${ELDMARK_ENTRY_ZONES:-vardheim=vado_gris,solmarch=vado_gris}
      ELDMARK_MAIL: smtp
      ELDMARK_MAIL_FROM: ${ELDMARK_MAIL_FROM:?ELDMARK_MAIL_FROM (el remitente de los correos)}
      ELDMARK_DATABASE_URL_FILE: /run/secrets/database_url
      ELDMARK_TICKET_KEYS_FILE: /run/secrets/ticket_keys
      ELDMARK_ZONE_TOKENS_FILE: /run/secrets/zone_tokens
      ELDMARK_EMAIL_HMAC_KEY_FILE: /run/secrets/email_hmac_key
      ELDMARK_SMTP_URL_FILE: /run/secrets/smtp_url
    secrets:
      - database_url
      - ticket_keys
      - zone_tokens
      - email_hmac_key
      - smtp_url
    networks:
      - edge
      - zones
      - data
    logging: *logging

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    depends_on:
      - platform
    environment:
      ELDMARK_DOMAIN: ${ELDMARK_DOMAIN}
      ELDMARK_ACME_EMAIL: ${ELDMARK_ACME_EMAIL:?ELDMARK_ACME_EMAIL (el correo de Let's Encrypt)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: ${ELDMARK_CADDY_IP:-172.30.0.2}
    logging: *logging

  # Las zonas (TEC-20 hace la imagen: el servidor exportado como ENTRYPOINT, con «--headless --»).
  # Las opciones --platform, --world, --channel y --public-address son de plataforma.md P4, y
  # --dtls-* de P9c. Una entrada por despliegue de zona, cada una con su token.
  zone-vado-gris:
    image: ${ELDMARK_ZONE_IMAGE:-eldmark-zone:local}
    profiles: [zonas]
    restart: unless-stopped
    depends_on:
      - platform
    command:
      - --server
      - --zone=vado_gris
      - --port=24600
      - --platform=http://platform:24681
      - --world=1
      - --channel=0
      - --public-address=${ELDMARK_PUBLIC_HOST:?ELDMARK_PUBLIC_HOST (el host al que conectan los clientes)}:24600
      - --dtls-cert=/run/secrets/vado_gris_dtls_cert
      - --dtls-key=/run/secrets/vado_gris_dtls_key
    environment:
      ELDMARK_ZONE_TOKEN_FILE: /run/secrets/zone_token_vado_gris
      ELDMARK_TICKET_KEYS_FILE: /run/secrets/ticket_keys
    secrets:
      - zone_token_vado_gris
      - ticket_keys
      - vado_gris_dtls_cert
      - vado_gris_dtls_key
    ports:
      - "24600:24600/udp"
    networks:
      - zones
    stop_grace_period: 30s
    logging: *logging

  # Operación (perfil ops; «docker compose run --rm <servicio>» los arranca aunque el perfil no esté
  # activo). La imagen ops trae PostgreSQL 16, los scripts y el binario de la plataforma.
  backup:
    image: ${ELDMARK_OPS_IMAGE:-eldmark-ops:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: ops
    profiles: [ops]
    restart: "no"
    command: ["/opt/eldmark/deploy/backup.sh"]
    environment:
      ELDMARK_DATABASE_URL_FILE: /run/secrets/database_url
      ELDMARK_BACKUP_DIR: /backups
    secrets:
      - database_url
    volumes:
      - ${ELDMARK_BACKUP_HOST_DIR:?ELDMARK_BACKUP_HOST_DIR (la carpeta de las copias en el VPS)}:/backups
    networks:
      - data
    logging: *logging

  restore-check:
    image: ${ELDMARK_OPS_IMAGE:-eldmark-ops:local}
    profiles: [ops]
    restart: "no"
    command: ["/opt/eldmark/deploy/restore_check.sh", "--dir", "/backups"]
    volumes:
      - ${ELDMARK_BACKUP_HOST_DIR}:/backups:ro
    network_mode: none
    logging: *logging

  pitr-check:
    image: ${ELDMARK_OPS_IMAGE:-eldmark-ops:local}
    profiles: [ops]
    restart: "no"
    command: ["/opt/eldmark/deploy/pitr_check.sh"]
    network_mode: none
    logging: *logging

networks:
  # Caddy y la API pública. IP fija de Caddy: es la única desde la que la plataforma lee X-Real-IP.
  edge:
    ipam:
      config:
        - subnet: ${ELDMARK_EDGE_SUBNET:-172.30.0.0/24}
  # Las zonas y la API interna.
  zones: {}
  # La base: sin salida a Internet.
  data:
    internal: true

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}

secrets:
  postgres_password:
    file: ${ELDMARK_SECRETS_DIR:-./secrets}/postgres_password
  database_url:
    file: ${ELDMARK_SECRETS_DIR:-./secrets}/database_url
  ticket_keys:
    file: ${ELDMARK_SECRETS_DIR:-./secrets}/ticket_keys
  zone_tokens:
    file: ${ELDMARK_SECRETS_DIR:-./secrets}/zone_tokens
  zone_token_vado_gris:
    file: ${ELDMARK_SECRETS_DIR:-./secrets}/zone_token_vado_gris
  vado_gris_dtls_cert:
    file: ${ELDMARK_SECRETS_DIR:-./secrets}/vado_gris_dtls_cert
  vado_gris_dtls_key:
    file: ${ELDMARK_SECRETS_DIR:-./secrets}/vado_gris_dtls_key
  email_hmac_key:
    file: ${ELDMARK_SECRETS_DIR:-./secrets}/email_hmac_key
  smtp_url:
    file: ${ELDMARK_SECRETS_DIR:-./secrets}/smtp_url
